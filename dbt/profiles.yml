# Credentials come from environment variables (the Airflow .env); nothing secret is committed.
lending_dw:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # Key-pair auth if SNOWFLAKE_PRIVATE_KEY_FILE is set, otherwise password (empty values are ignored)
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      # relative paths are relative to the project root; dbt runs from dbt/, hence '../'
      private_key_path: "{% set key = env_var('SNOWFLAKE_PRIVATE_KEY_FILE', '') %}{{ key if (not key or key.startswith('/')) else '../' ~ key }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE_PWD', '') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_TRANSFORM_WAREHOUSE', 'TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'LENDING') }}"
      schema: dev_{{ env_var('USER', 'me') }}
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # Key-pair auth if SNOWFLAKE_PRIVATE_KEY_FILE is set, otherwise password (empty values are ignored)
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      # relative paths are relative to the project root; dbt runs from dbt/, hence '../'
      private_key_path: "{% set key = env_var('SNOWFLAKE_PRIVATE_KEY_FILE', '') %}{{ key if (not key or key.startswith('/')) else '../' ~ key }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE_PWD', '') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_TRANSFORM_WAREHOUSE', 'TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'LENDING') }}"
      schema: analytics
      threads: 8
