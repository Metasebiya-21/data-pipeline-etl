# Credentials come from environment variables (the Airflow .env); nothing secret is committed.
lending_dw:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_TRANSFORM_WAREHOUSE', 'TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'LENDING') }}"
      schema: dev_{{ env_var('USER', 'me') }}
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_TRANSFORM_WAREHOUSE', 'TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'LENDING') }}"
      schema: analytics
      threads: 8
