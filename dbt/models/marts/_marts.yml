version: 2

models:
  - name: dim_customer
    description: Current customers (SCD Type 1), one row per source record. Deleted customers are excluded.
    columns:
      - name: record_key
        data_tests: [unique, not_null]

  - name: customer_addresses
    description: Customer addresses flattened from the personalAddresses array, enriched with region reference data.
    columns:
      - name: record_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: record_key
      - name: region_code
        data_tests:
          - relationships:
              arguments:
                to: ref('region_codes')
                field: region_code
              config:
                severity: warn      # an unknown region is a data-quality signal, not a pipeline failure

  - name: customer_bank_accounts
    columns:
      - name: record_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: record_key

  - name: dim_business
    columns:
      - name: business_key
        data_tests: [unique, not_null]
