version: '3.8'
networks:
  qena-network:
    external: true
    driver: bridge
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME}
  user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_etl_postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'True'
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./requirements.txt:/opt/airflow/requirements.txt
    - ./.env:/opt/airflow/.env
    - ./data:/opt/airflow/data
  networks:
    - qena-network
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: airflow_etl_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - qena-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  oracle:
    image: gvenzl/oracle-free:23.4
    container_name: airflow_etl_oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_PDB}
      ORACLE_APP_USER: ${ORACLE_APP_USER}
      ORACLE_APP_PASSWORD: ${ORACLE_APP_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/oracle-init:/container-entrypoint-initdb.d
      - ./db/oracle-init/report_etl_schema.sql:/container-entrypoint-initdb.d/report_etl_schema.sql:ro
    networks:
      - qena-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_etl_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    networks:
      - qena-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_etl_scheduler
    command: scheduler
    restart: always
    networks:
      - qena-network

  airflow-init:
    <<: *airflow-common
    container_name: airflow_etl_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username "${AIRFLOW_USERNAME}" \
          --password "${AIRFLOW_PASSWORD}" \
          --firstname "${AIRFLOW_FIRSTNAME}" \
          --lastname "${AIRFLOW_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_EMAIL}"
    restart: "no"
    networks:
      - qena-network

volumes:
  postgres-db-volume:
  oracle-data:
